<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>For Shikha ❤️ — From Vineet</title>
  <!-- Subtle Heart Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ----------------------------------------------------
       THEME & COLOR PALETTE
       Deep wine, burgundy, dark purple, blush pink, gold
    ---------------------------------------------------- */
    :root {
      --bg-dark: #0d0408;
      --bg-burgundy: #1d0713;
      --wine: #3d0c24;
      --wine-light: #5e163b;
      --accent-blush: #f3c2c7;
      --accent-rose: #d9788f;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.4);
      --cream: #fff8f0;
      --cream-paper: #fcf6ea;
      --text-muted: #c9b0b8;
      --glass-bg: rgba(35, 11, 23, 0.55);
      --glass-border: rgba(243, 194, 199, 0.15);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-hand: 'Great Vibes', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--cream);
      font-family: var(--font-sans);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Fixed Canvas for Stardust / Particles */
    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Subtle Progress Bar */
    #progress-dock {
      position: fixed;
      top: env(safe-area-inset-top, 14px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(18, 5, 12, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent-blush);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: opacity 0.5s ease;
      opacity: 0;
      pointer-events: none;
    }
    #progress-dock.visible {
      opacity: 1;
    }

    /* Audio Toggle Button */
    #music-btn {
      position: fixed;
      top: env(safe-area-inset-top, 14px);
      right: 16px;
      z-index: 100;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(35, 11, 23, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.2s, background 0.3s;
    }
    #music-btn:active {
      transform: scale(0.92);
    }
    #music-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Master Section Container */
    .story-section {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 70px 24px 80px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    /* Typography */
    .heading-serif {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 300;
      line-height: 1.25;
      color: #fff;
      text-shadow: 0 2px 14px rgba(217, 120, 143, 0.25);
    }
    .heading-hand {
      font-family: var(--font-hand);
      font-size: 2.3rem;
      color: var(--accent-blush);
      margin-bottom: 8px;
    }
    .body-p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--cream);
      font-weight: 300;
      opacity: 0.92;
      margin: 10px 0;
    }
    .text-gold {
      color: var(--gold);
    }
    .text-blush {
      color: var(--accent-blush);
    }
    .lead-pause {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .lead-pause.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* Buttons */
    .romantic-btn {
      position: relative;
      margin-top: 26px;
      padding: 15px 36px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #fff;
      background: linear-gradient(135deg, #4f102f, #2a081a);
      border: 1px solid rgba(243, 194, 199, 0.35);
      border-radius: 18px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(94, 22, 59, 0.6), inset 0 1px 1px rgba(255,255,255,0.2);
      transition: all 0.3s ease;
      animation: pulse-glow 3s infinite alternate;
    }
    .romantic-btn:active {
      transform: scale(0.96);
    }
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 15px rgba(94, 22, 59, 0.4); }
      100% { box-shadow: 0 0 30px rgba(217, 120, 143, 0.65), 0 0 10px var(--gold-soft); }
    }

    /* Section 1: Opening */
    .opening-salutation {
      font-family: var(--font-serif);
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 24px;
      color: var(--cream);
    }

    /* Section 3: The Random Profile Card */
    .profile-card {
      position: relative;
      width: 290px;
      background: rgba(28, 7, 19, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 14px 14px 20px 14px;
      margin: 20px 0;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      transform: scale(0.96);
      transition: transform 1.2s ease;
    }
    .profile-card.active-zoom {
      transform: scale(1.02);
    }
    .profile-img-wrap {
      width: 100%;
      height: 330px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }
    .profile-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: contrast(1.03) brightness(0.98);
    }
    .profile-tag {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(13, 4, 8, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      color: var(--accent-blush);
    }

    /* Section 5: ARRANGED -> LOVE Emotional Centerpiece */
    .centerpiece-box {
      margin: 24px 0;
      position: relative;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .word-arranged {
      position: absolute;
      font-family: var(--font-serif);
      font-size: 2.7rem;
      letter-spacing: 5px;
      color: #7a5462;
      text-decoration: line-through;
      text-decoration-color: var(--accent-rose);
      text-decoration-thickness: 3px;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .word-arranged.faded {
      opacity: 0;
      transform: scale(0.85);
    }
    .word-love {
      position: absolute;
      font-family: var(--font-serif);
      font-size: 3.3rem;
      letter-spacing: 6px;
      color: var(--gold);
      text-shadow: 0 0 25px rgba(212, 175, 55, 0.8), 0 0 50px rgba(217, 120, 143, 0.6);
      opacity: 0;
      transform: scale(1.15);
      transition: opacity 1.4s ease 0.3s, transform 1.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) 0.3s;
    }
    .word-love.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Polaroids & Film Frame */
    .polaroid-frame {
      background: #ffffff;
      padding: 12px 12px 36px 12px;
      border-radius: 4px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.7), 0 0 20px rgba(94, 22, 59, 0.3);
      max-width: 290px;
      margin: 20px auto;
      transform: rotate(-2deg);
      transition: transform 0.6s ease;
      color: #222;
    }
    .polaroid-frame img {
      width: 100%;
      height: 290px;
      object-fit: cover;
      border-radius: 2px;
      display: block;
    }
    .polaroid-caption {
      font-family: var(--font-hand);
      font-size: 1.55rem;
      margin-top: 14px;
      text-align: center;
      color: #333;
    }
    .float-polaroid {
      animation: float-gently 5s ease-in-out infinite alternate;
    }
    @keyframes float-gently {
      0% { transform: rotate(-2deg) translateY(0); }
      100% { transform: rotate(1deg) translateY(-14px); }
    }

    /* Memory Gallery */
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      width: 100%;
      margin: 25px 0;
    }
    .gallery-item {
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 10px 30px 10px;
      border-radius: 4px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      color: #29121a;
      transition: transform 0.4s ease;
    }
    .gallery-item:nth-child(even) {
      transform: rotate(2deg);
    }
    .gallery-item:nth-child(odd) {
      transform: rotate(-2.5deg);
    }
    .gallery-item:active {
      transform: scale(0.98) rotate(0deg);
    }
    .gallery-item img {
      width: 100%;
      height: 330px;
      object-fit: cover;
      border-radius: 2px;
      display: block;
    }
    .gallery-item p {
      font-family: var(--font-hand);
      font-size: 1.6rem;
      text-align: center;
      margin-top: 12px;
      color: #2a081a;
    }

    /* Section 8: Interactive Heart Tap */
    .heart-tap-container {
      margin: 30px 0;
      position: relative;
      cursor: pointer;
    }
    .pulsing-svg-heart {
      width: 86px;
      height: 86px;
      fill: #b31b4d;
      filter: drop-shadow(0 0 20px rgba(217, 44, 94, 0.6));
      animation: heart-beat 1.8s ease-in-out infinite;
      transition: transform 0.4s ease;
    }
    @keyframes heart-beat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.18); }
      28% { transform: scale(1.05); }
      42% { transform: scale(1.14); }
      70% { transform: scale(1); }
    }
    .heart-tap-hint {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-blush);
      margin-top: 12px;
      opacity: 0.8;
    }

    /* Section 9: Things I Love Cards */
    .reasons-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 340px;
      margin: 24px 0;
    }
    .reason-card {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px 20px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      box-shadow: 0 4px 18px rgba(0,0,0,0.3);
    }
    .reason-card.revealed {
      opacity: 1;
      transform: translateY(0);
    }
    .reason-icon {
      font-size: 1.25rem;
      color: var(--gold);
    }
    .reason-card span {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 400;
      color: var(--cream);
    }

    /* Infinity Symbol */
    .infinity-symbol {
      font-size: 2.8rem;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
      animation: pulse-infinity 3s infinite ease-in-out;
      margin: 15px 0;
    }
    @keyframes pulse-infinity {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 30px rgba(212, 175, 55, 0.95); }
    }

    /* Section 11: Birthday Surprise Cake */
    .birthday-cake-container {
      margin: 30px auto;
      cursor: pointer;
      position: relative;
    }
    .cake-base {
      width: 180px;
      height: 90px;
      background: linear-gradient(180deg, #571336 0%, #30081d 100%);
      border: 1px solid rgba(243, 194, 199, 0.25);
      border-radius: 16px 16px 8px 8px;
      position: relative;
      display: flex;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .cake-icing {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 24px;
      background: #801d4a;
      border-radius: 16px 16px 12px 12px;
      border-bottom: 2px solid var(--accent-blush);
    }
    .candle {
      position: absolute;
      top: -34px;
      width: 10px;
      height: 35px;
      background: linear-gradient(180deg, #fff 0%, var(--accent-blush) 100%);
      border-radius: 4px;
    }
    .flame {
      position: absolute;
      top: -18px;
      left: -2px;
      width: 14px;
      height: 20px;
      background: radial-gradient(circle, #fff7ad 20%, #ff8b2c 70%, transparent 100%);
      border-radius: 50% 50% 30% 30%;
      box-shadow: 0 0 16px #ff9e2c;
      animation: flicker 0.15s infinite alternate;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.1) rotate(2deg); }
    }
    .flame.blown-out {
      opacity: 0 !important;
      transform: translateY(-8px) scale(0.3) !important;
    }

    /* Section 12: Love Letter Envelope */
    .envelope-box {
      width: 290px;
      height: 190px;
      background: #47112c;
      border: 1px solid rgba(243, 194, 199, 0.35);
      border-radius: 12px;
      position: relative;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: 25px 0;
      overflow: hidden;
    }
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 145px solid transparent;
      border-right: 145px solid transparent;
      border-top: 105px solid #63183f;
      transform-origin: top;
      transition: transform 0.8s ease;
      z-index: 2;
    }
    .envelope-box.opened .envelope-flap {
      transform: rotateX(180deg);
      z-index: 0;
    }
    .wax-seal {
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #931936, #5c081e);
      border-radius: 50%;
      position: absolute;
      top: 75px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      border: 1px solid rgba(212, 175, 55, 0.5);
      font-size: 1.2rem;
      color: var(--gold);
      transition: opacity 0.5s ease;
    }
    .envelope-box.opened .wax-seal {
      opacity: 0;
      pointer-events: none;
    }

    /* Letter Parchment Modal / In-flow sheet */
    .letter-paper {
      width: 100%;
      max-width: 420px;
      background: var(--cream-paper);
      color: #2b111a;
      border-radius: 8px;
      padding: 32px 24px;
      margin-top: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 60px rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.4);
      display: none;
      text-align: left;
      position: relative;
      background-image: radial-gradient(#eadbc5 1px, transparent 1px);
      background-size: 20px 20px;
      animation: unroll 0.8s ease forwards;
    }
    @keyframes unroll {
      0% { opacity: 0; transform: translateY(20px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .letter-paper h3 {
      font-family: var(--font-hand);
      font-size: 2.2rem;
      margin-bottom: 16px;
      color: #520f2e;
    }
    .letter-paper p {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      line-height: 1.75;
      margin-bottom: 16px;
      color: #2b111a;
    }
    .letter-paper .sign {
      font-family: var(--font-hand);
      font-size: 2.1rem;
      text-align: right;
      color: #520f2e;
      margin-top: 20px;
    }

    /* Section 13: Final Scene */
    .final-heart {
      width: 44px;
      height: 44px;
      fill: var(--gold);
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.8));
      margin-bottom: 20px;
    }

    /* Secret Surprise Trigger */
    #secret-trigger {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 100;
      width: 28px;
      height: 28px;
      opacity: 0.25;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    #secret-trigger:hover, #secret-trigger:active {
      opacity: 0.9;
    }

    /* Secret Modal */
    #secret-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(8, 2, 5, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #secret-modal.open {
      display: flex;
    }
    .secret-content {
      max-width: 360px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      position: relative;
    }
    .secret-close {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 1.4rem;
      color: var(--accent-blush);
      cursor: pointer;
    }

    .cinematic-gap {
      height: 20px;
    }

    /* Audio Mute Icon helper */
    .music-bar {
      display: inline-block;
      width: 3px;
      height: 12px;
      background-color: var(--gold);
      margin: 0 1.5px;
      border-radius: 2px;
      animation: sound-bounce 1.2s infinite ease-in-out alternate;
    }
    .music-bar:nth-child(2) { animation-delay: 0.2s; height: 16px; }
    .music-bar:nth-child(3) { animation-delay: 0.4s; height: 9px; }
    @keyframes sound-bounce {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.3); }
    }
    .music-muted .music-bar {
      animation: none;
      transform: scaleY(0.3);
      opacity: 0.4;
    }
  </style>
</head>
<body>

  <!-- Audio Element for "Tu Hai" -->
  <audio id="bg-audio" loop preload="auto">
    <source src="tu-hai.mp3" type="audio/mpeg">
  </audio>

  <!-- Background Particle & Stardust Canvas -->
  <canvas id="stars-canvas"></canvas>

  <!-- Progress Indicator -->
  <div id="progress-dock">
    <span id="progress-text">01 — The Beginning</span>
  </div>

  <!-- Music Controller -->
  <button id="music-btn" aria-label="Toggle Romantic Music" class="music-muted">
    <div id="music-bars-wrap">
      <span class="music-bar"></span>
      <span class="music-bar"></span>
      <span class="music-bar"></span>
    </div>
  </button>

  <!-- ==========================================
       SECTION 1: LANDING SCREEN (MYSTERIOUS)
  =========================================== -->
  <section class="story-section" id="sec-1" data-index="01 — The Beginning">
    <h1 class="opening-salutation lead-pause revealed">Shikha...</h1>
    <p
